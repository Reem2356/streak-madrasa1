<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ستريك مدرستي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg: #FBF6EC;
    --bg-grain: #F5EEDF;
    --surface: #FFFFFF;
    --surface-soft: #FAF5EA;
    --ink: #0B3B34;
    --ink-2: #0F4C43;
    --ink-3: #123F38;
    --text: #1D2B27;
    --text-muted: #6B7C76;
    --turquoise: #159B90;
    --turquoise-2: #1FBBAC;
    --turquoise-tint: #E1F5F2;
    --gold: #CE9A34;
    --gold-2: #E8B94A;
    --gold-tint: #FBF0D9;
    --rose: #E07E96;
    --rose-2: #EFA6B7;
    --rose-tint: #FBE9EE;
    --bronze: #B97B4F;
    --silver: #96A8A4;
    --line: #E7DFCC;
    --shadow: 0 10px 30px -12px rgba(11,59,52,.28);
    --shadow-soft: 0 4px 14px -6px rgba(11,59,52,.18);
    --radius: 20px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 480px at 15% -10%, var(--turquoise-tint) 0%, transparent 60%),
      radial-gradient(900px 420px at 110% 10%, var(--gold-tint) 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction:rtl;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-variant-numeric: tabular-nums;
  }
  h1,h2,h3{ font-family:'Lalezar','Cairo',sans-serif; font-weight:400; letter-spacing:.5px; text-wrap:balance; margin:0; }
  p{margin:0}
  button{ font-family:inherit; }
  ::selection{ background:var(--turquoise-2); color:#fff; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  /* ---------- header ---------- */
  .topbar{
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 55%, var(--turquoise) 130%);
    color:#fff;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    position:relative;
    overflow:hidden;
    box-shadow: var(--shadow);
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,.14) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    opacity:.5;
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
  .brand .flame{ width:34px; height:34px; flex:none; }
  .brand-text h1{ font-size:1.5rem; color:#fff; line-height:1; }
  .brand-text span{ font-size:.72rem; color:var(--gold-2); letter-spacing:.5px; }
  .user-chip{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    padding:6px 14px 6px 6px;
    border-radius:18px;
  }
  .user-chip .avatar{
    width:30px; height:30px; border-radius:50%;
    background: linear-gradient(145deg, var(--gold-2), var(--gold));
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.85rem;
  }
  .user-chip .who{ font-size:.82rem; color:#fff; line-height:1.15; text-align:right; }
  .user-chip .who b{ display:block; font-size:.9rem; }
  .logout-btn{
    background:transparent; border:none; color:rgba(255,255,255,.85);
    font-size:.78rem; cursor:pointer; text-decoration:underline; padding:0 4px;
  }
  .logout-btn:hover{ color:#fff; }
  .dash-nav-btn{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
    color:#fff; font-size:.78rem; font-weight:700; cursor:pointer;
    padding:6px 12px; border-radius:999px; white-space:nowrap;
  }
  .dash-nav-btn:hover{ background:rgba(255,255,255,.24); }

  @media (max-width:560px){
    .topbar{ justify-content:center; text-align:center; padding:14px 16px; }
    .brand{ flex-direction:column; gap:6px; }
    .brand-text h1{ font-size:1.25rem; }
    .user-chip{ width:100%; justify-content:center; padding:8px 12px; }
    .user-chip .who{ text-align:center; }
  }

  /* ---------- layout ---------- */
  main{ flex:1; display:flex; justify-content:center; padding:36px 16px 20px; }
  .stage{ width:100%; max-width:460px; }
  .stage.wide{ max-width:920px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-soft);
    padding:28px 26px;
  }
  .card + .card{ margin-top:18px; }

  .screen{ animation: fadeSlide .38s ease both; }
  @keyframes fadeSlide{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- auth ---------- */
  .school-logo{ display:block; margin:0 auto 16px; max-width:150px; width:100%; height:auto; }
  .auth-head{ text-align:center; margin-bottom:20px; }
  .auth-head h2{ font-size:1.9rem; color:var(--ink); }
  .auth-head p{ color:var(--text-muted); font-size:.9rem; margin-top:6px; }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:.82rem; font-weight:700; color:var(--ink-3); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line);
    font-size:.95rem; font-family:inherit; background:var(--surface-soft); color:var(--text);
    transition:.2s;
  }
  .field input:focus, .field select:focus{
    outline:none; border-color:var(--turquoise); background:#fff;
    box-shadow:0 0 0 4px var(--turquoise-tint);
  }
  .hint{ font-size:.74rem; color:var(--text-muted); margin-top:5px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px 16px; border-radius:14px; border:none; cursor:pointer;
    font-weight:800; font-size:.98rem; transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    background:linear-gradient(135deg, var(--turquoise-2), var(--turquoise));
    color:#fff; box-shadow:0 10px 22px -10px rgba(21,155,144,.65);
  }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; filter:none; box-shadow:none; }
  .btn-ghost{
    background:transparent; color:var(--ink); border:1.5px solid var(--line);
  }
  .btn-ghost:hover{ border-color:var(--turquoise); color:var(--turquoise); }
  .btn-gold{
    background:linear-gradient(135deg, var(--gold-2), var(--gold));
    color:var(--ink); box-shadow:0 10px 22px -10px rgba(206,154,52,.65);
  }

  .alert{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--gold-tint); border:1px solid #E8D9A8;
    color:#6B5316; padding:12px 14px; border-radius:14px;
    font-size:.82rem; line-height:1.6; margin-bottom:18px;
  }
  .alert .dot{ flex:none; font-size:1.05rem; margin-top:1px; }
  .error-msg{
    background:var(--rose-tint); color:#9C2E48; border:1px solid #F1C4D0;
    padding:10px 13px; border-radius:12px; font-size:.83rem; margin-bottom:14px;
  }

  /* ---------- submission screen ---------- */
  .who-card{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--ink), var(--ink-2));
    color:#fff; padding:16px 18px; border-radius:16px; margin-bottom:20px;
  }
  .who-card .avatar-lg{
    width:46px; height:46px; border-radius:50%; flex:none;
    background:linear-gradient(145deg, var(--gold-2), var(--gold));
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:1.1rem;
  }
  .who-card .meta b{ display:block; font-size:1.05rem; }
  .who-card .meta span{ font-size:.78rem; color:var(--turquoise-tint); }

  .week-pill{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--turquoise-tint); color:var(--turquoise); font-weight:700;
    font-size:.76rem; padding:5px 12px; border-radius:999px; margin-bottom:16px;
  }

  .uploader{
    border:2px dashed var(--line); border-radius:16px; padding:22px;
    text-align:center; cursor:pointer; transition:.2s; background:var(--surface-soft);
    position:relative;
  }
  .uploader.has-file{ border-style:solid; border-color:var(--turquoise-2); background:var(--turquoise-tint); }
  .uploader:hover{ border-color:var(--turquoise-2); }
  .uploader input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .uploader .upicon{ font-size:1.8rem; margin-bottom:6px; }
  .uploader .uptext{ font-weight:700; color:var(--ink-3); font-size:.9rem; }
  .uploader .upsub{ font-size:.76rem; color:var(--text-muted); margin-top:4px; }

  .preview-wrap{ margin-top:14px; text-align:center; }
  .preview-wrap img{
    max-width:100%; max-height:230px; border-radius:14px; border:1px solid var(--line);
    box-shadow:var(--shadow-soft);
  }
  .preview-actions{ display:flex; gap:10px; margin-top:12px; }

  .done-card{ text-align:center; padding:30px 20px; }
  .done-card .big-check{ font-size:2.6rem; margin-bottom:6px; }
  .done-card h3{ font-size:1.3rem; color:var(--ink); margin-bottom:6px; }
  .done-card p{ color:var(--text-muted); font-size:.88rem; }

  /* ---------- success overlay ---------- */
  .success-overlay{
    position:fixed; inset:0; z-index:50;
    background:linear-gradient(160deg, rgba(11,59,52,.97), rgba(21,155,144,.95));
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:#fff; text-align:center; padding:20px; overflow:hidden;
  }
  .confetti{ position:absolute; top:-10px; width:10px; height:14px; border-radius:2px; opacity:.9; animation: fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(115vh) rotate(400deg); opacity:.2; } }
  .success-flame{ width:96px; height:96px; margin-bottom:10px; animation: pop .55s ease; }
  @keyframes pop{ 0%{ transform:scale(.3) rotate(-8deg); opacity:0;} 60%{ transform:scale(1.12) rotate(4deg); opacity:1;} 100%{ transform:scale(1) rotate(0);} }
  .success-overlay h2{ font-size:2rem; margin-bottom:8px; }
  .success-overlay p{ font-size:.95rem; opacity:.92; max-width:320px; }
  .success-overlay .btn{ margin-top:22px; max-width:220px; }

  /* ---------- dashboard ---------- */
  .dash-grid{ display:grid; grid-template-columns: 1.1fr 1.4fr; gap:18px; align-items:start; }
  @media (max-width: 760px){ .dash-grid{ grid-template-columns:1fr; } }

  .profile-card{ text-align:center; }
  .profile-avatar{
    width:76px; height:76px; border-radius:50%; margin:0 auto 12px;
    background:linear-gradient(145deg, var(--gold-2), var(--gold));
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:1.7rem; font-weight:800; box-shadow:var(--shadow-soft);
  }
  .profile-card h2{ font-size:1.35rem; color:var(--ink); }
  .profile-card .grade-tag{
    display:inline-block; margin-top:4px; font-size:.78rem; font-weight:700;
    color:var(--turquoise); background:var(--turquoise-tint); padding:3px 12px; border-radius:999px;
  }

  .balance-box{
    margin-top:18px; padding:16px; border-radius:16px;
    background:linear-gradient(135deg, var(--gold-tint), #fff);
    border:1px solid #EFDFAE; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-box .coin{ font-size:1.6rem; }
  .balance-box .num{ font-family:'Lalezar'; font-size:2rem; color:var(--gold); line-height:1; }
  .balance-box .lbl{ font-size:.76rem; color:var(--text-muted); font-weight:700; }

  .streak-flame-wrap{ display:flex; flex-direction:column; align-items:center; margin-top:18px; }
  .streak-flame-wrap .flame{ width:64px; height:64px; }
  .streak-num{ font-family:'Lalezar'; font-size:2.4rem; color:var(--ink); line-height:1; margin-top:2px; }
  .streak-lbl{ font-size:.78rem; color:var(--text-muted); font-weight:700; }

  .progress-block{ margin-top:20px; text-align:right; }
  .progress-block .row-lbl{ display:flex; justify-content:space-between; font-size:.8rem; font-weight:700; color:var(--ink-3); margin-bottom:8px; }
  .segments{ display:flex; gap:6px; }
  .seg{ flex:1; height:12px; border-radius:8px; background:var(--surface-soft); border:1px solid var(--line); overflow:hidden; }
  .seg.filled{ background:linear-gradient(135deg, var(--turquoise-2), var(--turquoise)); border-color:var(--turquoise); }
  .badges-count{ margin-top:8px; font-size:.76rem; color:var(--text-muted); }

  .section-title{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .section-title h3{ font-size:1.2rem; color:var(--ink); }
  .section-title .ico{ font-size:1.1rem; }

  .history-list{ display:flex; flex-direction:column; gap:10px; }
  .history-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-soft); border:1px solid var(--line);
    border-radius:14px; padding:9px 12px;
  }
  .history-item img{ width:46px; height:46px; border-radius:10px; object-fit:cover; flex:none; border:1px solid var(--line); }
  .history-item .hi-text{ flex:1; }
  .history-item .hi-text b{ display:block; font-size:.88rem; color:var(--ink-3); }
  .history-item .hi-text span{ font-size:.74rem; color:var(--text-muted); }
  .history-item .hi-check{ color:var(--turquoise); font-size:1.1rem; flex:none; }
  .empty-note{ text-align:center; color:var(--text-muted); font-size:.85rem; padding:18px 0; }

  .prize-banner{
    background:linear-gradient(135deg, var(--rose-tint), var(--gold-tint));
    border:1px solid #F0DCC4; border-radius:14px; padding:10px 14px;
    text-align:center; font-weight:800; color:#8A4A2F; font-size:.86rem; margin-bottom:14px;
  }

  .leader-list{ display:flex; flex-direction:column; gap:8px; }
  .leader-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:14px; border:1px solid var(--line); background:var(--surface-soft);
  }
  .leader-row.me{ border-color:var(--turquoise-2); box-shadow:0 0 0 3px var(--turquoise-tint); }
  .leader-row .rank{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9rem;
    background:#fff; border:1.5px solid var(--line); color:var(--ink-3);
  }
  .leader-row.r1 .rank{ background:linear-gradient(145deg, var(--gold-2), var(--gold)); color:#fff; border-color:transparent; }
  .leader-row.r2 .rank{ background:linear-gradient(145deg, #C7D3D0, var(--silver)); color:#fff; border-color:transparent; }
  .leader-row.r3 .rank{ background:linear-gradient(145deg, #D6A579, var(--bronze)); color:#fff; border-color:transparent; }
  .leader-row .lname{ flex:1; font-weight:700; font-size:.9rem; color:var(--ink-3); }
  .leader-row .lname small{ display:block; font-weight:600; font-size:.72rem; color:var(--text-muted); }
  .leader-row .lcount{ font-family:'Lalezar'; font-size:1.15rem; color:var(--turquoise); }
  .leader-row .lcount small{ font-family:'Cairo'; font-size:.65rem; color:var(--text-muted); font-weight:700; }

  .dash-actions{ display:flex; gap:10px; margin-top:20px; }

  /* ---------- footer ---------- */
  footer{
    background:var(--ink);
    color:rgba(255,255,255,.82);
    padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; text-align:center;
    font-size:.78rem;
  }
  footer .center-tag{
    font-family:'Lalezar'; font-size:.95rem; color:var(--gold-2); letter-spacing:.3px;
  }
  footer .side{ flex:1; min-width:150px; }
  footer .side.right-side{ text-align:right; }
  footer .side.left-side{ text-align:left; }
  @media (max-width:600px){
    footer{ flex-direction:column; }
    footer .side.right-side, footer .side.left-side{ text-align:center; }
  }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="flame" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="flame-icon-header">
      <path d="M12 2C12 2 7 7.5 7 12.5C7 16.09 9.24 19 12 19C14.76 19 17 16.09 17 12.5C17 11 16.4 9.6 15.6 8.4C15.5 9.4 15 10.2 14.3 10.7C14.6 9.2 14.1 7 12.6 5C12.9 6.5 12.3 7.6 11.5 8.3C10.4 9.2 9.6 10.3 9.6 11.8C9.6 12.6 9.9 13.3 10.4 13.8C9.5 13.6 8.8 12.7 8.8 11.6C8.8 10 9.8 8.9 9.8 8.9C9.8 8.9 7 10.5 7 13.2C7 15.6 8.9 17.5 12 17.5C14.8 17.5 16.5 15.5 16.5 13C16.5 10 14.5 8 14.5 8C14.5 8 12 5.5 12 2Z" fill="url(#flameGrad)"/>
      <defs>
        <linearGradient id="flameGrad" x1="7" y1="19" x2="17" y2="2" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#E8B94A"/>
          <stop offset="0.55" stop-color="#EFA6B7"/>
          <stop offset="1" stop-color="#1FBBAC"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="brand-text">
      <h1>ستريك مدرستي</h1>
      <span>المتوسطة السابعة بعرعر</span>
    </div>
  </div>
  <div class="user-chip" id="userChip" hidden>
    <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    <button class="dash-nav-btn" id="dashNavBtn">🏆 لوحة الإنجازات</button>
    <div class="who"><b id="chipName"></b><span id="chipGrade"></span></div>
    <div class="avatar" id="chipAvatar"></div>
  </div>
</div>

<main>
  <div class="stage" id="stage">
    <!-- screens injected here -->
  </div>
</main>

<footer>
  <div class="side right-side">مديرة المدرسة: جواهر الرويلي</div>
  <div class="center-tag">معًا نصنع التميز</div>
  <div class="side left-side">إعداد: ريم الخمسان</div>
</footer>

<div id="overlayRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyABziPJeOsWkqL1Bwlw25QOex1f8abP1kM",
    authDomain: "streak-madrasa.firebaseapp.com",
    projectId: "streak-madrasa",
    storageBucket: "streak-madrasa.firebasestorage.app",
    messagingSenderId: "707992205215",
    appId: "1:707992205215:web:ac439d0ce2297871e86faa"
  };
  firebase.initializeApp(firebaseConfig);
  var fs = firebase.firestore();
  var FieldValue = firebase.firestore.FieldValue;

  var SESSION_KEY = "streakMadrasa_session_v1";
  var WEEKLY_TARGET = 4;
  var POINTS_PER_SUBMIT = 50;

  var GRADES = ["الأول متوسط", "الثاني متوسط", "الثالث متوسط"];
  var SECTIONS = ["١", "٢", "موهبة"];

  function classLabel(student){
    if(!student || !student.section) return student ? student.grade : "";
    var sectionText = student.section === "موهبة" ? "موهبة" : ("فصل " + student.section);
    return student.grade + " · " + sectionText;
  }

  var stage = document.getElementById("stage");
  var overlayRoot = document.getElementById("overlayRoot");
  var userChip = document.getElementById("userChip");
  var chipName = document.getElementById("chipName");
  var chipGrade = document.getElementById("chipGrade");
  var chipAvatar = document.getElementById("chipAvatar");
  var logoutBtn = document.getElementById("logoutBtn");
  var dashNavBtn = document.getElementById("dashNavBtn");

  function getSessionUser(){
    try{ return localStorage.getItem(SESSION_KEY) || null; }catch(e){ return null; }
  }
  function setSessionUser(u){
    try{
      if(u) localStorage.setItem(SESSION_KEY, u);
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){}
  }

  function isoWeekKey(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    var weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
    return date.getUTCFullYear() + "-W" + (weekNo < 10 ? "0"+weekNo : weekNo);
  }
  function todayWeekKey(){ return isoWeekKey(new Date()); }

  function fmtDate(iso){
    var d = new Date(iso);
    return d.toLocaleDateString("ar-SA", { day:"numeric", month:"long", year:"numeric" });
  }

  function initials(name){
    name = (name||"").trim();
    return name ? name[0] : "؟";
  }

  function friendlyDbError(e){
    if(e && e.code === "permission-denied") return "تعذّر الوصول لقاعدة البيانات (صلاحيات). تواصلي مع مسؤولة الموقع.";
    return "حدث خطأ في الاتصال بالخادم، تأكدي من الإنترنت وحاولي مرة أخرى.";
  }

  /* ---------------- data layer (Firestore, shared by every student) ---------------- */
  function db_getStudent(username){
    return fs.collection("students").doc(username).get().then(function(snap){
      if(!snap.exists) return null;
      return Object.assign({ username: username }, snap.data());
    });
  }
  function db_createStudent(username, data){
    return fs.collection("students").doc(username).set(Object.assign({ submissionsCount: 0 }, data));
  }
  function db_hasSubmittedWeek(username, weekKey){
    return fs.collection("students").doc(username).collection("submissions").doc(weekKey).get().then(function(snap){
      return snap.exists;
    });
  }
  function db_addSubmission(username, weekKey, subData){
    var studentRef = fs.collection("students").doc(username);
    var subRef = studentRef.collection("submissions").doc(weekKey);
    return fs.runTransaction(function(tx){
      return tx.get(subRef).then(function(subSnap){
        if(subSnap.exists) throw new Error("already-submitted");
        tx.set(subRef, subData);
        tx.update(studentRef, { submissionsCount: FieldValue.increment(1), lastWeek: weekKey });
      });
    });
  }
  function db_getSubmissions(username){
    return fs.collection("students").doc(username).collection("submissions").orderBy("dateISO", "desc").get().then(function(qs){
      var out = [];
      qs.forEach(function(doc){ out.push(Object.assign({ week: doc.id }, doc.data())); });
      return out;
    });
  }
  function db_getSubmissionOne(username, weekKey){
    return fs.collection("students").doc(username).collection("submissions").doc(weekKey).get().then(function(snap){
      return snap.exists ? Object.assign({ week: weekKey }, snap.data()) : null;
    });
  }
  function db_deleteSubmission(username, weekKey){
    var studentRef = fs.collection("students").doc(username);
    var subRef = studentRef.collection("submissions").doc(weekKey);
    return subRef.delete().then(function(){
      return studentRef.collection("submissions").orderBy("dateISO", "desc").limit(1).get();
    }).then(function(qs){
      var patch = { submissionsCount: FieldValue.increment(-1) };
      patch.lastWeek = qs.empty ? FieldValue.delete() : qs.docs[0].id;
      return studentRef.update(patch);
    });
  }
  function db_allStudentsRanked(){
    return fs.collection("students").orderBy("submissionsCount", "desc").limit(500).get().then(function(qs){
      var out = [];
      qs.forEach(function(doc){ out.push(Object.assign({ username: doc.id }, doc.data())); });
      return out;
    });
  }

  /* ---------------- image handling ---------------- */
  function resizeImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read-failed")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode-failed")); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w,h));
          var cw = Math.round(w*scale), ch = Math.round(h*scale);
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- ranking ---------------- */
  function computeRanking(){
    return db_allStudentsRanked().then(function(students){
      var list = students.map(function(s){
        return { username:s.username, displayName:s.displayName, grade:s.grade, section:s.section, count:s.submissionsCount||0 };
      });
      var rank = 0, prevCount = null, seen = 0;
      return list.map(function(item){
        seen++;
        if(item.count !== prevCount){ rank = seen; prevCount = item.count; }
        return Object.assign({ rank:rank }, item);
      });
    });
  }

  /* ---------------- confetti ---------------- */
  function spawnConfetti(container, n){
    var colors = ["#E8B94A","#1FBBAC","#EFA6B7","#FBF6EC"];
    for(var i=0;i<n;i++){
      var el = document.createElement("div");
      el.className = "confetti";
      el.style.left = (Math.random()*100) + "%";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = (2 + Math.random()*1.6) + "s";
      el.style.animationDelay = (Math.random()*0.4) + "s";
      container.appendChild(el);
    }
  }

  /* ---------------- rendering ---------------- */
  function clearStage(){ stage.innerHTML = ""; }

  function renderLoading(){
    clearStage();
    var wrap = document.createElement("div");
    wrap.className = "screen card";
    wrap.innerHTML = '<div class="done-card"><div class="big-check">⏳</div><p>جارٍ التحميل...</p></div>';
    stage.appendChild(wrap);
  }

  function renderConnError(retryFn){
    clearStage();
    var wrap = document.createElement("div");
    wrap.className = "screen card";
    wrap.innerHTML = '<div class="error-msg" style="margin-bottom:16px;">تعذّر الاتصال بقاعدة البيانات. تأكدي من اتصالك بالإنترنت.</div><button class="btn btn-primary" id="retryBtn">إعادة المحاولة</button>';
    stage.appendChild(wrap);
    wrap.querySelector("#retryBtn").addEventListener("click", retryFn);
  }

  function renderChip(student){
    if(!student){ userChip.hidden = true; return; }
    userChip.hidden = false;
    chipName.textContent = student.displayName;
    chipGrade.textContent = classLabel(student);
    chipAvatar.textContent = initials(student.displayName);
  }

  function goAuth(){
    setSessionUser(null);
    renderChip(null);
    renderAuth();
  }

  function goSubmit(username){
    renderSubmit(username);
  }

  function goDashboard(username){
    renderDashboard(username);
  }

        '<h2>أهلًا بكِ في ستريكك المدرسي</h2>' +
        '<p>اكتبي اسمكِ واختاري اسم المستخدم وصفكِ الدراسي لتبدئي توثيق مشاركاتك الأسبوعية في مدرستي</p>' +

      '<div class="field"><label>الصف الدراسي</label><select id="authGrade">' +
        GRADES.map(function(g){ return '<option value="'+g+'">'+g+'</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label>الفصل</label><select id="authSection">' +
        SECTIONS.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join("") +
      '</select></div>' +
      '<button class="btn btn-primary" id="authBtn">دخول 🔥</button>';
    stage.appendChild(wrap);

    var errorSlot = wrap.querySelector("#errorSlot");
    function showError(msg){
      errorSlot.innerHTML = '<div class="error-msg">' + msg + '</div>';
    }

    var authBtn = wrap.querySelector("#authBtn");

    function submit(){
      var name = wrap.querySelector("#authName").value.trim();
      var user = wrap.querySelector("#authUser").value.trim();
      var grade = wrap.querySelector("#authGrade").value;
      var section = wrap.querySelector("#authSection").value;
      errorSlot.innerHTML = "";

      if(!user || user.length < 3){ return showError("اسم المستخدم يجب ألا يقل عن ٣ أحرف."); }
      if(!/^[a-zA-Z0-9_ء-ي]+$/.test(user)){ return showError("اسم المستخدم يجب أن يحتوي أحرفًا وأرقامًا فقط."); }

      authBtn.disabled = true;
      authBtn.textContent = "جارٍ التحقق...";

      db_getStudent(user).then(function(existing){
        if(existing){
          setSessionUser(user);
          renderChip(existing);
          goSubmit(user);
          return;
        }

        if(!name){ authBtn.disabled=false; authBtn.textContent="دخول 🔥"; return showError("فضلًا اكتبي اسمكِ الكامل."); }

        return db_createStudent(user, { displayName:name, grade:grade, section:section, createdAt:new Date().toISOString() }).then(function(){
          setSessionUser(user);
          renderChip({ username:user, displayName:name, grade:grade, section:section, submissionsCount:0 });
          goSubmit(user);
        });
      }).catch(function(e){
        authBtn.disabled = false;
        authBtn.textContent = "دخول 🔥";
        showError(friendlyDbError(e));
      });
    }

    authBtn.addEventListener("click", submit);
    wrap.querySelector("#authUser").addEventListener("keydown", function(e){
      if(e.key === "Enter") submit();
    });
  }

  /* ---- SUBMIT SCREEN ---- */
  function renderSubmit(username){
    renderLoading();
    var weekKey = todayWeekKey();

    Promise.all([ db_getStudent(username), db_hasSubmittedWeek(username, weekKey) ]).then(function(results){
      var student = results[0];
      var already = results[1];
      if(!student){ return goAuth(); }
      renderChip(student);
      if(already){
        return db_getSubmissionOne(username, weekKey).then(function(sub){
          buildSubmitScreen(username, student, weekKey, already, sub);
        });
      }
      buildSubmitScreen(username, student, weekKey, already, null);
    }).catch(function(){
      renderConnError(function(){ renderSubmit(username); });
    });
  }

  function buildSubmitScreen(username, student, weekKey, already, currentSub){
    clearStage();

    var wrap = document.createElement("div");
    wrap.className = "screen card";

    var head =
      '<div class="who-card">' +
        '<div class="avatar-lg">' + initials(student.displayName) + '</div>' +
        '<div class="meta"><b>' + student.displayName + '</b><span>' + classLabel(student) + '</span></div>' +
      '</div>';

    if(already){
      wrap.innerHTML = head +
        '<div class="done-card">' +
          '<div class="big-check">✅</div>' +
          '<h3>أنجزتِ مشاركة هذا الأسبوع بالفعل</h3>' +
          '<p>هذه هي صورة مشاركتك لهذا الأسبوع. يمكنكِ حذفها ورفع صورة أخرى إذا أردتِ.</p>' +
        '</div>' +
        (currentSub ? '<div class="preview-wrap"><img src="' + currentSub.image + '" alt="صورة مشاركة هذا الأسبوع" style="cursor:zoom-in" id="curSubImg" /></div>' : '') +
        '<div class="preview-actions" style="margin-top:14px;">' +
          (currentSub ? '<button class="btn btn-ghost" id="delSubBtn">حذف المشاركة</button>' : '') +
          '<button class="btn btn-primary" id="toDash">الذهاب إلى لوحة الإنجازات</button>' +
        '</div>';
      wrap.querySelector("#toDash").addEventListener("click", function(){ goDashboard(username); });
      var curImg = wrap.querySelector("#curSubImg");
      if(curImg) curImg.addEventListener("click", function(){ window.open(currentSub.image, "_blank"); });
      var delBtn = wrap.querySelector("#delSubBtn");
      if(delBtn) delBtn.addEventListener("click", function(){
        if(!confirm("هل تريدين حذف مشاركة هذا الأسبوع؟ ستحتاجين لرفع صورة جديدة بعد الحذف.")) return;
        delBtn.disabled = true;
        delBtn.textContent = "جارٍ الحذف...";
        db_deleteSubmission(username, weekKey).then(function(){
          renderSubmit(username);
        }).catch(function(){
          delBtn.disabled = false;
          delBtn.textContent = "حذف المشاركة";
          alert("تعذّر حذف المشاركة، حاولي مرة أخرى.");
        });
      });
      stage.appendChild(wrap);
      return;
    }

    wrap.innerHTML = head +
      '<div class="week-pill">📅 مشاركة الأسبوع الحالي</div>' +
      '<div class="field"><label>صورة توثيق الستريك</label>' +
        '<div class="uploader" id="uploaderBox">' +
          '<input type="file" accept="image/*" id="fileInput" />' +
          '<div class="upicon">📸</div>' +
          '<div class="uptext">اضغطي لاختيار صورة أو اسحبيها هنا</div>' +
          '<div class="upsub">JPG أو PNG — سيتم ضغط الصورة تلقائيًا</div>' +
        '</div>' +
        '<div id="previewSlot"></div>' +
      '</div>' +
      '<div id="submitErr"></div>' +
      '<button class="btn btn-primary" id="submitBtn" disabled>إرسال المشاركة 🔥</button>';

    stage.appendChild(wrap);

    var fileInput = wrap.querySelector("#fileInput");
    var uploaderBox = wrap.querySelector("#uploaderBox");
    var previewSlot = wrap.querySelector("#previewSlot");
    var submitBtn = wrap.querySelector("#submitBtn");
    var submitErr = wrap.querySelector("#submitErr");
    var pendingDataUrl = null;

    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file) return;
      submitErr.innerHTML = "";
      resizeImage(file, 900, 0.8).then(function(dataUrl){
        pendingDataUrl = dataUrl;
        uploaderBox.classList.add("has-file");
        previewSlot.innerHTML =
          '<div class="preview-wrap"><img src="' + dataUrl + '" alt="معاينة صورة المشاركة" />' +
          '<div class="preview-actions"><button class="btn btn-ghost" id="clearImg">اختيار صورة أخرى</button></div></div>';
        submitBtn.disabled = false;
        wrap.querySelector("#clearImg").addEventListener("click", function(){
          pendingDataUrl = null;
          fileInput.value = "";
          uploaderBox.classList.remove("has-file");
          previewSlot.innerHTML = "";
          submitBtn.disabled = true;
        });
      }).catch(function(){
        submitErr.innerHTML = '<div class="error-msg">تعذّرت قراءة الصورة، جرّبي صورة أخرى.</div>';
      });
    });

    submitBtn.addEventListener("click", function(){
      if(!pendingDataUrl) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "جارٍ الإرسال...";
      var sub = { dateISO: new Date().toISOString(), image: pendingDataUrl, points: POINTS_PER_SUBMIT };
      db_addSubmission(username, weekKey, sub).then(function(){
        showSuccessOverlay(username);
      }).catch(function(e){
        submitBtn.disabled = false;
        submitBtn.textContent = "إرسال المشاركة 🔥";
        if(e && e.message === "already-submitted"){
          submitErr.innerHTML = '<div class="error-msg">يبدو أنكِ سجّلتِ مشاركة هذا الأسبوع بالفعل من جهاز آخر.</div>';
        } else {
          submitErr.innerHTML = '<div class="error-msg">' + friendlyDbError(e) + '</div>';
        }
      });
    });
  }

  /* ---- SUCCESS OVERLAY ---- */
  var CELEBRATION_MESSAGES = [
    "رائع! استمراريتك هي سرّ تميّزك 🌟",
    "شعلة جديدة أُضيفت لستريكك 🔥",
    "خطوة أخرى نحو القمة، أحسنتِ!",
    "التزامك يصنع الفرق، واصلي!"
  ];

  function showSuccessOverlay(username){
    var msg = CELEBRATION_MESSAGES[Math.floor(Math.random()*CELEBRATION_MESSAGES.length)];
    var ov = document.createElement("div");
    ov.className = "success-overlay";
    ov.innerHTML =
      '<svg class="success-flame" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M12 2C12 2 7 7.5 7 12.5C7 16.09 9.24 19 12 19C14.76 19 17 16.09 17 12.5C17 11 16.4 9.6 15.6 8.4C15.5 9.4 15 10.2 14.3 10.7C14.6 9.2 14.1 7 12.6 5C12.9 6.5 12.3 7.6 11.5 8.3C10.4 9.2 9.6 10.3 9.6 11.8C9.6 12.6 9.9 13.3 10.4 13.8C9.5 13.6 8.8 12.7 8.8 11.6C8.8 10 9.8 8.9 9.8 8.9C9.8 8.9 7 10.5 7 13.2C7 15.6 8.9 17.5 12 17.5C14.8 17.5 16.5 15.5 16.5 13C16.5 10 14.5 8 14.5 8C14.5 8 12 5.5 12 2Z" fill="#E8B94A"/>' +
      '</svg>' +
      '<h2>تم تسجيل مشاركتك بنجاح!</h2>' +
      '<p>' + msg + '</p>' +
      '<button class="btn btn-gold" id="contBtn">عرض لوحة الإنجازات</button>';
    overlayRoot.appendChild(ov);
    spawnConfetti(ov, 26);

    var timer = setTimeout(proceed, 2400);
    ov.querySelector("#contBtn").addEventListener("click", proceed);

    function proceed(){
      clearTimeout(timer);
      if(ov.parentNode) ov.parentNode.removeChild(ov);
      goDashboard(username);
    }
  }

  /* ---- DASHBOARD SCREEN ---- */
  function renderDashboard(username){
    renderLoading();

    Promise.all([ db_getStudent(username), db_getSubmissions(username), computeRanking() ]).then(function(results){
      var student = results[0];
      var subs = results[1];
      var ranking = results[2];
      if(!student){ return goAuth(); }
      buildDashboardScreen(username, student, subs, ranking);
    }).catch(function(){
      renderConnError(function(){ renderDashboard(username); });
    });
  }

  function buildDashboardScreen(username, student, subs, ranking){
    renderChip(student);

    clearStage();
    stage.classList.add("wide");

    var total = subs.length;
    var points = total * POINTS_PER_SUBMIT;
    var cycleProgress = total % WEEKLY_TARGET;
    var filledSegs = cycleProgress === 0 && total > 0 ? WEEKLY_TARGET : cycleProgress;
    var badgesEarned = Math.floor(total / WEEKLY_TARGET);
    var weekKey = todayWeekKey();
    var canSubmitThisWeek = !subs.some(function(s){ return s.week === weekKey; });

    var myRankInfo = ranking.find(function(r){ return r.username === username; });

    var wrap = document.createElement("div");
    wrap.className = "screen";

    var segHtml = "";
    for(var i=0;i<WEEKLY_TARGET;i++){
      segHtml += '<div class="seg' + (i < filledSegs ? ' filled' : '') + '"></div>';
    }

    var historyHtml = subs.length ? subs.map(function(s){
      return '<div class="history-item">' +
        '<img src="' + s.image + '" alt="صورة توثيق مشاركة أسبوع ' + s.week + '" class="hist-thumb" data-full="' + s.image + '" style="cursor:zoom-in" />' +
        '<div class="hi-text"><b>الأسبوع ' + s.week.split("-W")[1] + ' &middot; ' + s.week.split("-W")[0] + '</b><span>' + fmtDate(s.dateISO) + '</span></div>' +
        '<div class="hi-check">✔</div>' +
      '</div>';
    }).join("") : '<div class="empty-note">لا توجد مشاركات مسجّلة بعد، ابدئي أول ستريك لكِ!</div>';

    var leaderHtml = ranking.map(function(r){
      var cls = "leader-row" + (r.rank===1?" r1":r.rank===2?" r2":r.rank===3?" r3":"") + (r.username===username?" me":"");
      return '<div class="' + cls + '">' +
        '<div class="rank">' + r.rank + '</div>' +
        '<div class="lname">' + r.displayName + '<small>' + classLabel(r) + '</small></div>' +
        '<div class="lcount">' + r.count + '<small> مشاركة</small></div>' +
      '</div>';
    }).join("");

    wrap.innerHTML =
      '<div class="dash-grid">' +
        '<div>' +
          '<div class="card profile-card">' +
            '<div class="profile-avatar">' + initials(student.displayName) + '</div>' +
            '<h2>' + student.displayName + '</h2>' +
            '<div class="grade-tag">' + classLabel(student) + '</div>' +
            '<div class="balance-box"><span class="coin">🪙</span><div><div class="num">' + points + '</div><div class="lbl">رصيد النقاط</div></div></div>' +
            '<div class="streak-flame-wrap">' +
              '<svg class="flame" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M12 2C12 2 7 7.5 7 12.5C7 16.09 9.24 19 12 19C14.76 19 17 16.09 17 12.5C17 11 16.4 9.6 15.6 8.4C15.5 9.4 15 10.2 14.3 10.7C14.6 9.2 14.1 7 12.6 5C12.9 6.5 12.3 7.6 11.5 8.3C10.4 9.2 9.6 10.3 9.6 11.8C9.6 12.6 9.9 13.3 10.4 13.8C9.5 13.6 8.8 12.7 8.8 11.6C8.8 10 9.8 8.9 9.8 8.9C9.8 8.9 7 10.5 7 13.2C7 15.6 8.9 17.5 12 17.5C14.8 17.5 16.5 15.5 16.5 13C16.5 10 14.5 8 14.5 8C14.5 8 12 5.5 12 2Z" fill="url(#flameGrad2)"/>' +
                '<defs><linearGradient id="flameGrad2" x1="7" y1="19" x2="17" y2="2" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#CE9A34"/><stop offset="0.6" stop-color="#E07E96"/><stop offset="1" stop-color="#159B90"/></linearGradient></defs>' +
              '</svg>' +
              '<div class="streak-num">' + total + '</div>' +
              '<div class="streak-lbl">إجمالي المشاركات</div>' +
            '</div>' +
            '<div class="progress-block">' +
              '<div class="row-lbl"><span>تقدّم الدورة الحالية</span><span>' + filledSegs + ' / ' + WEEKLY_TARGET + '</span></div>' +
              '<div class="segments">' + segHtml + '</div>' +
              '<div class="badges-count">🏅 عدد الشارات المكتملة: ' + badgesEarned + '</div>' +
            '</div>' +
            '<div class="dash-actions">' +
              (canSubmitThisWeek ? '<button class="btn btn-primary" id="newSub">تسجيل مشاركة جديدة</button>' : '<button class="btn btn-ghost" id="viewSub">عرض مشاركة هذا الأسبوع ✓</button>') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card">' +
            '<div class="section-title"><span class="ico">📖</span><h3>سجل مشاركاتك</h3></div>' +
            '<div class="history-list">' + historyHtml + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="section-title"><span class="ico">🏆</span><h3>لوحة الصدارة</h3></div>' +
            '<div class="prize-banner">🎁 جوائز مالية للفائزات</div>' +
            (myRankInfo ? '<p style="text-align:center;font-size:.82rem;color:var(--text-muted);margin-bottom:12px;">ترتيبك الحالي: <b style="color:var(--ink);">المركز ' + myRankInfo.rank + '</b></p>' : '') +
            '<div class="leader-list">' + leaderHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    stage.appendChild(wrap);

    if(canSubmitThisWeek){
      var btn = wrap.querySelector("#newSub");
      if(btn) btn.addEventListener("click", function(){ stage.classList.remove("wide"); goSubmit(username); });
    } else {
      var viewBtn = wrap.querySelector("#viewSub");
      if(viewBtn) viewBtn.addEventListener("click", function(){ stage.classList.remove("wide"); goSubmit(username); });
    }

    wrap.querySelectorAll(".hist-thumb").forEach(function(img){
      img.addEventListener("click", function(){ window.open(img.getAttribute("data-full"), "_blank"); });
    });
  }

  logoutBtn.addEventListener("click", function(){
    stage.classList.remove("wide");
    goAuth();
  });

  dashNavBtn.addEventListener("click", function(){
    var session = getSessionUser();
    if(session) goDashboard(session);
  });

  /* ---------------- boot ---------------- */
  (function boot(){
    var session = getSessionUser();
    if(!session){ return goAuth(); }

    renderLoading();
    var weekKey = todayWeekKey();
    db_getStudent(session).then(function(student){
      if(!student){ return goAuth(); }
      renderChip(student);
      return db_hasSubmittedWeek(session, weekKey).then(function(already){
        if(already){
          return Promise.all([ db_getSubmissions(session), computeRanking() ]).then(function(results){
            buildDashboardScreen(session, student, results[0], results[1]);
          });
        }
        buildSubmitScreen(session, student, weekKey, false);
      });
    }).catch(function(){
      renderConnError(boot);
    });
  })();

})();
</script>
</body>
</html>
